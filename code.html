<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>/lamement/</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { background-color: #590000; color: #ffffff; font-family: Arial, sans-serif; display: flex; flex-direction: column; align-items: center; min-height: 100vh; }
        header { width: 100%; background-color: #3b0000; display: flex; justify-content: space-between; align-items: center; padding: 15px 30px; border-bottom: 3px solid #240000; }
        .banner-img-placeholder { width: 70px; height: 70px; background-color: #240000; border: 1px dashed #ffffff; display: flex; align-items: center; justify-content: center; text-align: center; font-size: 10px; padding: 5px; color: #ffcccc; }
        .board-title { font-size: 3rem; font-weight: normal; letter-spacing: 2px; cursor: pointer; }
        .controls-bar { width: 80%; max-width: 800px; display: flex; justify-content: space-between; align-items: center; margin: 20px 0 10px 0; }
        .btn { background-color: #7a0000; color: white; border: 1px solid #ff9999; padding: 8px 16px; cursor: pointer; font-size: 1rem; }
        .btn:hover { background-color: #990000; }
        .stats { font-size: 0.9rem; color: #ffcccc; }
        .view { width: 80%; max-width: 800px; display: none; flex-direction: column; gap: 20px; margin-bottom: 30px; }
        .view.active { display: flex; }
        .feed-container { max-height: 70vh; overflow-y: auto; display: flex; flex-direction: column; gap: 20px; padding-right: 5px; }
        .empty-state { text-align: center; font-size: 1.2rem; color: #ffb3b3; margin-top: 50px; }
        .post-card { background-color: #610000; border: 2px solid #7a0000; padding: 20px; cursor: pointer; transition: background-color 0.2s; }
        .post-card:hover { background-color: #6e0000; }
        .post-header { font-size: 1.5rem; margin-bottom: 5px; }
        .post-meta { font-size: 0.85rem; color: #ffb3b3; margin-bottom: 15px; }
        .post-body { display: flex; gap: 20px; align-items: flex-start; }
        .post-image-box { max-width: 250px; max-height: 300px; flex-shrink: 0; display: flex; align-items: center; justify-content: center; overflow: hidden; }
        .post-image-box img { max-width: 100%; max-height: 250px; width: auto; height: auto; object-fit: contain; display: block; }
        .post-text { font-size: 0.95rem; line-height: 1.4; word-break: break-word; flex-grow: 1; }
        .latest-comment { margin-top: 15px; padding-top: 10px; border-top: 1px dashed #800000; font-size: 0.9rem; color: #ffd1d1; }
        .thread-container { background-color: #610000; border: 2px solid #7a0000; padding: 20px; }
        .comments-section { margin-top: 25px; display: flex; flex-direction: column; gap: 15px; }
        .comments-list { display: flex; flex-direction: column; gap: 10px; max-height: 40vh; overflow-y: auto; padding-right: 5px; }
        .comment-card { background-color: #4a0000; border: 1px solid #7a0000; padding: 12px; font-size: 0.9rem; word-break: break-word; }
        .comment-meta { font-size: 0.75rem; color: #ffb3b3; margin-bottom: 5px; }
        .comment-form { display: flex; flex-direction: column; gap: 10px; margin-top: 15px; }
        .comment-form textarea { width: 100%; padding: 8px; background-color: #3b0000; color: white; border: 1px solid #7a0000; resize: vertical; }
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background-color: rgba(0, 0, 0, 0.7); justify-content: center; align-items: center; z-index: 100; }
        .modal-content { background-color: #4a0000; padding: 20px; border: 2px solid #7a0000; width: 90%; max-width: 500px; display: flex; flex-direction: column; gap: 12px; }
        .modal-content input, .modal-content textarea { width: 100%; padding: 8px; background-color: #3b0000; color: white; border: 1px solid #7a0000; }
        .modal-buttons { display: flex; justify-content: flex-end; gap: 10px; }
    </style>
</head>
<body>

    <header>
        <div class="banner-img-placeholder">an image will be put here later</div>
        <div class="board-title" onclick="switchView('feed')">/lamement/</div>
        <div class="banner-img-placeholder">an image will be put here later</div>
    </header>

    <div class="controls-bar">
        <button class="btn" onclick="openModal()">Make Post</button>
        <div class="stats" id="post-counter">Total Posts: 0</div>
    </div>

    <div id="feed-view" class="view active">
        <div class="feed-container" id="feed-container"></div>
    </div>

    <div id="thread-view" class="view">
        <button class="btn" style="align-self: flex-start;" onclick="switchView('feed')">← Back to Feed</button>
        <div id="thread-content" class="thread-container"></div>
        <div class="comments-section">
            <h3>Comments</h3>
            <div class="comments-list" id="comments-list"></div>
            <div class="comment-form">
                <textarea id="comment-text-input" placeholder="Write a comment as Anonymous..." rows="3"></textarea>
                <button class="btn" style="align-self: flex-end;" onclick="submitComment()">Post Comment</button>
            </div>
        </div>
    </div>

    <div class="modal" id="post-modal">
        <div class="modal-content">
            <h3>Create New Post</h3>
            <input type="text" id="post-title-input" placeholder="Post Title">
            <textarea id="post-text-input" placeholder="Write your post content here..." rows="4"></textarea>
            <input type="file" id="post-image-input" accept="image/*">
            <div class="modal-buttons">
                <button class="btn" onclick="closeModal()">Cancel</button>
                <button class="btn" onclick="submitPost()">Submit</button>
            </div>
        </div>
    </div>

    <script>
        // Using JSONbin.io (Free tier JSON storage bin API)
        // You can create a free bin at jsonbin.io, paste your Bin ID and Master Key here:
        const BIN_ID = '6a99f8ecf5f4af5e296761dd'; 
        const API_KEY = '$2a$10$k40Gu.rzrjBSJraaZ4d2qeHBtSF3G/k08rJEver.RGgG2kSPrGn5C'; 
        const API_URL = `https://api.jsonbin.io/v3/b/${BIN_ID}`;

        let posts = [];
        let currentPostId = null;

        function updateCounter() {
            document.getElementById('post-counter').innerText = `Total Posts: ${posts.length}`;
        }

        function switchView(viewName) {
            document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
            if (viewName === 'feed') {
                document.getElementById('feed-view').classList.add('active');
                fetchPosts();
            } else if (viewName === 'thread') {
                document.getElementById('thread-view').classList.add('active');
                renderThread();
            }
        }

        async function fetchPosts() {
            try {
                const response = await fetch(API_URL + '/latest', {
                    headers: { 'X-Master-Key': API_KEY }
                });
                const data = await response.json();
                posts = data.record.posts || [];
                renderFeed();
            } catch (err) {
                console.error("Error fetching posts:", err);
            }
        }

        async function savePostsToCloud() {
            try {
                await fetch(API_URL, {
                    method: 'PUT',
                    headers: {
                        'Content-Type': 'application/json',
                        'X-Master-Key': API_KEY
                    },
                    body: JSON.stringify({ posts: posts })
                });
            } catch (err) {
                console.error("Error saving to cloud:", err);
            }
        }

        function renderFeed() {
            const container = document.getElementById('feed-container');
            container.innerHTML = '';

            if (posts.length === 0) {
                container.innerHTML = `<div class="empty-state">Nobody's here... yet.</div>`;
                updateCounter();
                return;
            }

            posts.forEach((post) => {
                const card = document.createElement('div');
                card.className = 'post-card';
                card.onclick = () => openThread(post.id);

                let imageHtml = post.image ? `<div class="post-image-box"><img src="${post.image}" alt="Uploaded image"></div>` : '';
                let latestCommentHtml = '';
                if (post.comments && post.comments.length > 0) {
                    const latest = post.comments[post.comments.length - 1];
                    latestCommentHtml = `<div class="latest-comment">Latest: Anonymous: ${escapeHtml(latest.content)}</div>`;
                }

                card.innerHTML = `
                    <div class="post-header">${escapeHtml(post.title)}</div>
                    <div class="post-meta">${escapeHtml(post.author)} · ${post.comments.length} replies</div>
                    <div class="post-body">
                        ${imageHtml}
                        <div class="post-text">${escapeHtml(post.content)}</div>
                    </div>
                    ${latestCommentHtml}
                `;
                container.appendChild(card);
            });

            updateCounter();
        }

        function openThread(id) {
            currentPostId = id;
            switchView('thread');
        }

        function renderThread() {
            const post = posts.find(p => p.id === currentPostId);
            if (!post) {
                switchView('feed');
                return;
            }

            const threadContent = document.getElementById('thread-content');
            let imageHtml = post.image ? `<div class="post-image-box"><img src="${post.image}" alt="Uploaded image"></div>` : '';

            threadContent.innerHTML = `
                <div class="post-header">${escapeHtml(post.title)}</div>
                <div class="post-meta">${escapeHtml(post.author)} · ${post.comments.length} replies</div>
                <div class="post-body">
                    ${imageHtml}
                    <div class="post-text">${escapeHtml(post.content)}</div>
                </div>
            `;

            const commentsList = document.getElementById('comments-list');
            commentsList.innerHTML = '';

            if (post.comments.length === 0) {
                commentsList.innerHTML = `<div style="color: #ffb3b3; font-size: 0.9rem;">No comments yet. Be the first to reply!</div>`;
                return;
            }

            post.comments.forEach(comment => {
                const commentDiv = document.createElement('div');
                commentDiv.className = 'comment-card';
                commentDiv.innerHTML = `
                    <div class="comment-meta">${escapeHtml(comment.author)}</div>
                    <div>${escapeHtml(comment.content)}</div>
                `;
                commentsList.appendChild(commentDiv);
            });
        }

        function openModal() { document.getElementById('post-modal').style.display = 'flex'; }
        function closeModal() { document.getElementById('post-modal').style.display = 'none'; }

        async function submitPost() {
            const titleInput = document.getElementById('post-title-input');
            const textInput = document.getElementById('post-text-input');
            const imageInput = document.getElementById('post-image-input');

            if (!titleInput.value.trim() || !textInput.value.trim()) {
                alert('Please fill out both the title and text content.');
                return;
            }

            const createNewPostObj = (imageData) => {
                const newPost = {
                    id: Date.now(),
                    title: titleInput.value.trim(),
                    author: "Anonymous",
                    content: textInput.value.trim(),
                    image: imageData || null,
                    comments: []
                };
                posts.unshift(newPost);
                saveAndRestore();
            };

            const saveAndRestore = async () => {
                await savePostsToCloud();
                resetForm();
                renderFeed();
            };

            if (imageInput.files && imageInput.files[0]) {
                const reader = new FileReader();
                reader.onload = (e) => createNewPostObj(e.target.result);
                reader.readAsDataURL(imageInput.files[0]);
            } else {
                createNewPostObj(null);
            }
        }

        function resetForm() {
            document.getElementById('post-title-input').value = '';
            document.getElementById('post-text-input').value = '';
            document.getElementById('post-image-input').value = '';
            closeModal();
        }

        async function submitComment() {
            const commentInput = document.getElementById('comment-text-input');
            const text = commentInput.value.trim();
            if (!text) return;

            const post = posts.find(p => p.id === currentPostId);
            if (post) {
                post.comments.push({
                    author: "Anonymous",
                    content: text
                });
                commentInput.value = '';
                await savePostsToCloud();
                renderThread();
            }
        }

        function escapeHtml(text) {
            const map = { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' };
            return text.replace(/[&<>"']/g, m => map[m]);
        }

        // Initial fetch on page load
        fetchPosts();
    </script>
</body>
</html>
